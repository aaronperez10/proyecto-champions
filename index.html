<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UEFA Champions League - Partidos y Resultados</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <span class="star">⭐</span>
                <h1>CHAMPIONS LEAGUE</h1>
            </div>
            <p class="subtitle">Temporada 2026/27 • Fase de Liga</p>
        </div>
    </header>

    <main class="container main-content">
        <!-- Controles y Filtros -->
        <section class="controls-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar equipo (ej. Real Madrid, Man City)...">
            </div>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">Todos</button>
                <button class="filter-btn" data-filter="live">🔴 En Vivo</button>
                <button class="filter-btn" data-filter="finished">✅ Finalizados</button>
                <button class="filter-btn" data-filter="upcoming">⏳ Próximos</button>
            </div>
        </section>

        <!-- Sección de Partidos -->
        <section class="matches-section">
            <h2>Partidos de la Jornada</h2>
            <div id="matches-container" class="matches-grid">
                <!-- Las tarjetas de partidos se cargarán con JavaScript -->
            </div>
        </section>

        <!-- Tabla de Clasificación -->
        <section class="standings-section">
            <h2>Tabla de Posiciones (Fase de Liga)</h2>
            <div class="table-responsive">
                <table class="standings-table">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Equipo</th>
                            <th>PJ</th>
                            <th>G</th>
                            <th>E</th>
                            <th>P</th>
                            <th>GF</th>
                            <th>GC</th>
                            <th>DG</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-tbody">
                        <!-- La clasificación se cargará con JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 UEFA Champions League Simulation. Proyecto educativo y sencillo.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
